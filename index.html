<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funfinity — Toko Mainan</title>
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body
  class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100 text-gray-900 
             dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 dark:text-white 
             transition-all duration-500 ease-in-out"
>
  <!-- Navbar -->
  <nav
    class="p-4 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white shadow-lg sticky top-0 z-50"
  >
    <div class="flex justify-between items-center max-w-6xl mx-auto">
      <h1 class="text-2xl font-extrabold tracking-wide">Funfinity</h1>

      <!-- Tombol menu (muncul hanya di HP) -->
      <button id="menuToggle" class="text-3xl sm:hidden focus:outline-none">
        ☰
      </button>

      <!-- Menu besar -->
      <ul
        id="menuList"
        class="hidden sm:flex gap-8 text-lg font-medium"
      >
        <li><a href="#" class="hover:text-yellow-300 transition">Beranda</a></li>
        <li><a href="#produk" class="hover:text-yellow-300 transition">Produk</a></li>
        <li><a href="#kontak" class="hover:text-yellow-300 transition">Kontak</a></li>
      </ul>

      <!-- Tombol kanan -->
      <div class="hidden sm:flex items-center gap-4">
        <button id="cartBtn" class="relative text-2xl hover:scale-110 transition">
          🛒
          <span
            id="cartCount"
            class="absolute -top-2 -right-2 bg-yellow-400 text-gray-900 text-xs font-bold px-2 py-0.5 rounded-full"
            >0</span
          >
        </button>
        <button
          id="darkToggle"
          class="ml-2 p-2 bg-white/20 rounded-full hover:bg-white/30 transition text-xl"
        >
          🌙
        </button>
      </div>
    </div>

    <!-- Menu dropdown HP -->
    <div
      id="mobileMenu"
      class="hidden sm:hidden flex flex-col gap-3 text-center mt-4 bg-gradient-to-b from-pink-500/90 via-purple-500/90 to-indigo-500/90 rounded-xl py-4"
    >
      <a href="#" class="hover:text-yellow-300 transition">Beranda</a>
      <a href="#produk" class="hover:text-yellow-300 transition">Produk</a>
      <a href="#kontak" class="hover:text-yellow-300 transition">Kontak</a>

      <!-- Tombol kanan versi HP -->
      <div class="flex justify-center gap-4 mt-3">
        <button
          id="cartBtnMobile"
          class="relative text-2xl hover:scale-110 transition"
        >
          🛒
          <span
            id="cartCountMobile"
            class="absolute -top-2 -right-2 bg-yellow-400 text-gray-900 text-xs font-bold px-2 py-0.5 rounded-full"
            >0</span
          >
        </button>
        <button
          id="darkToggleMobile"
          class="p-2 bg-white/20 rounded-full hover:bg-white/30 transition text-xl"
        >
          🌙
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="text-center pt-14 pb-14 px-6" data-aos="fade-down">
    <h2
      class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text 
      bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 leading-snug sm:leading-tight text-center"
      style="-webkit-background-clip: text; -webkit-text-fill-color: transparent;"
    >
      Selamat Datang di Funfinity
    </h2>
    <p class="mt-4 text-base sm:text-lg text-gray-700 dark:text-gray-300">
      Temukan mainan favoritmu 🚀🎮🧩
    </p>
    <button
      class="mt-6 px-8 py-3 bg-yellow-400 text-gray-900 font-bold rounded-lg shadow 
      hover:shadow-yellow-400/70 hover:scale-105 transition"
      data-aos="fade-up"
    >
      Belanja Sekarang
    </button>
  </header>

  <!-- Produk -->
  <main
    id="produk"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 max-w-6xl mx-auto px-6 pb-20"
  >
    <!-- Produk cards kamu tetap sama -->
    <!-- (copy 3 produk di versi kamu) -->
  </main>

  <!-- Cart Popup -->
  <div
    id="cartPopup"
    class="fixed top-24 right-6 bg-white dark:bg-gray-900 p-6 rounded-xl shadow-xl w-80 hidden z-50"
  >
    <h3 class="text-lg font-bold mb-3">🛒 Keranjang</h3>
    <ul id="cartItems" class="space-y-2 text-sm max-h-60 overflow-y-auto"></ul>
    <p
      id="cartTotal"
      class="mt-3 font-bold text-gray-800 dark:text-gray-200"
    >
      Total: Rp 0
    </p>
    <button
      id="clearCart"
      class="mt-4 w-full bg-red-500 text-white py-2 rounded-lg hover:scale-105 transition"
    >
      Hapus Semua
    </button>
  </div>

  <!-- Footer -->
  <footer
    id="kontak"
    class="text-center p-6 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white mt-10"
  >
    <p>© 2025 Funfinity. Semua Hak Dilindungi.</p>
  </footer>

  <!-- Script tetap sama -->
  <script>
    // script kamu copy dari versi sebelumnya (tidak perlu diubah)
  </script>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init({ duration: 900, once: true });</script>
</body>

</html>
